<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DS">
  <!-- DS monogram — Dev Shah, and Data Science.
       Both letters are heavy strokes rather than <text>: favicons render where
       font availability isn't guaranteed, so a typed letter can fall back to
       something unintended. Paths look identical everywhere.
       Stroke weight is set for 16px legibility, not for how it looks at 150px —
       thinner reads more elegant large and turns to mush in a tab bar.
       Filled tile (not a bare letter) so the mark holds its shape on both
       light and dark tab bars. -->
  <defs>
    <linearGradient id="ds" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb1"/>
      <stop offset=".55" stop-color="#e07ac4"/>
      <stop offset="1" stop-color="#b39dff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#ds)"/>

  <g fill="none" stroke="#fff" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 18v28h8.5c8.6 0 14-5.6 14-14s-5.4-14-14-14H13z"/>
    <path d="M51 24c0-3.7-3.9-6-8.6-6s-8.2 2.4-8.2 6.1c0 8 16.6 5.2 16.6 14.2 0 4.3-3.9 6.7-9 6.7-4.8 0-8.6-2.2-8.6-5.9"/>
  </g>
</svg>
